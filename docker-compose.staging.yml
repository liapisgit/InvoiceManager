services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: false
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_BASE_URL}
      WEBHOOK_URL: ${N8N_PUBLIC_BASE_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      NODES_EXCLUDE: "[]"
    ports:
      - "${N8N_PORT:-5679}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      FRONTEND_DIST_PATH: /app/BackEnd/public
      DATABASE_URL: ${DATABASE_URL}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/${N8N_WEBHOOK_PATH}
      N8N_INVOICE_DATA_WEBHOOK_URL: http://n8n:5678/webhook/${N8N_INVOICE_DATA_WEBHOOK_PATH}
      N8N_DELETE_DUPLICATES_WEBHOOK_URL: http://n8n:5678/webhook/${N8N_DELETE_DUPLICATES_WEBHOOK_PATH}
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - backend_uploads:/app/BackEnd/uploads

  backend-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-build
    profiles: ["tools"]
    working_dir: /app/BackEnd
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npm", "run", "prisma:migrate:deploy"]

volumes:
  n8n_data:
  backend_uploads: